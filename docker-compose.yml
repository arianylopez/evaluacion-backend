version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: mesa_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres_init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - mesa_network

  redis:
    image: redis:7-alpine
    container_name: mesa_redis
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - mesa_network

  django:
    build: ./backend/django_admin
    container_name: mesa_django
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - REDIS_HOST=redis
    command: >
      sh -c "python manage.py collectstatic --noinput &&
             python manage.py migrate &&
             python manage.py init_admin &&
             python manage.py seed_db &&
             gunicorn core.wsgi:application --bind 0.0.0.0:8000 --workers 3 --threads 2"
    volumes:
      - django_static:/app/staticfiles
    networks:
      - mesa_network

  fastapi:
    build: ./backend/fastapi_app
    container_name: mesa_fastapi
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - REDIS_HOST=redis
    command: >
      sh -c "uvicorn app.main:app --host 0.0.0.0 --port 8080 --workers 4"
    networks:
      - mesa_network

  nginx:
    image: nginx:alpine
    container_name: mesa_nginx
    restart: always
    depends_on:
      - django
      - fastapi
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/404.html:/usr/share/nginx/errors/404.html:ro
      - ./frontend:/usr/share/nginx/html:ro
      - django_static:/app/staticfiles:ro
    networks:
      - mesa_network

volumes:
  postgres_data:
  django_static:

networks:
  mesa_network:
    driver: bridge